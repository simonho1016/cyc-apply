<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>role test</title></head>
<body>
<pre id="log">running…</pre>
<script>
const log = [];
const P = (name, ok) => log.push((ok ? 'PASS' : 'FAIL') + ' ' + name);
function setAuth(role){
  sessionStorage.setItem('cyc-portal-auth', JSON.stringify({ p: 'test', exp: Date.now() + 3600000, email: 'test@sbccyc.org.hk', role }));
  sessionStorage.removeItem('cyc-sim');
}
function loadFrame(url){
  return new Promise(res => {
    const f = document.createElement('iframe');
    f.style.cssText = 'width:800px;height:600px';
    f.src = url;
    f.onload = () => setTimeout(() => res(f), 1200);
    document.body.appendChild(f);
  });
}
(async () => {
  try {
    // ---- tutor ----
    setAuth('tutor');
    let f = await loadFrame('/sign/');
    let w = f.contentWindow;
    P('tutor /sign/ 顯示 noPerm', !w.document.getElementById('noPerm').classList.contains('hidden'));
    P('tutor /sign/ 收埋 signMain', w.document.getElementById('signMain').classList.contains('hidden'));
    f.remove();
    f = await loadFrame('/report/');
    w = f.contentWindow;
    P('tutor /report/ 顯示 noPerm', !w.document.getElementById('noPerm').classList.contains('hidden'));
    f.remove();
    f = await loadFrame('/vault/');
    w = f.contentWindow;
    P('tutor /vault/ 唯讀 banner', !w.document.getElementById('roBanner').classList.contains('hidden'));
    P('tutor /vault/ 收埋月結簽署捷徑', w.document.getElementById('t_sign').classList.contains('hidden'));
    f.remove();
    f = await loadFrame('/apply/');
    w = f.contentWindow;
    P('tutor /apply/ 收埋月結簽署捷徑', w.document.getElementById('t_sign').classList.contains('hidden'));
    P('tutor /apply/ 收埋後台捷徑', w.document.getElementById('t_admin').classList.contains('hidden'));
    f.remove();

    // ---- sw ----
    setAuth('sw');
    f = await loadFrame('/sign/');
    w = f.contentWindow;
    P('sw /sign/ 入到 signMain', !w.document.getElementById('signMain').classList.contains('hidden'));
    P('sw canSignSlot(social)=true', w.eval('canSignSlot("social")') === true);
    P('sw canSignSlot(officer)=false', w.eval('canSignSlot("officer")') === false);
    P('sw canSignSlot(reviewer)=false', w.eval('canSignSlot("reviewer")') === false);
    f.remove();
    f = await loadFrame('/report/');
    w = f.contentWindow;
    P('sw /report/ 顯示 noPerm（維持 cashier+）', !w.document.getElementById('noPerm').classList.contains('hidden'));
    f.remove();
    f = await loadFrame('/vault/');
    w = f.contentWindow;
    P('sw /vault/ 唯讀 banner', !w.document.getElementById('roBanner').classList.contains('hidden'));
    P('sw /vault/ 見到月結簽署捷徑', !w.document.getElementById('t_sign').classList.contains('hidden'));
    f.remove();
    f = await loadFrame('/apply/');
    w = f.contentWindow;
    P('sw /apply/ 見到月結簽署捷徑', !w.document.getElementById('t_sign').classList.contains('hidden'));
    P('sw /apply/ 收埋後台捷徑', w.document.getElementById('t_admin').classList.contains('hidden'));
    f.remove();

    // ---- cashier（照舊）----
    setAuth('cashier');
    f = await loadFrame('/sign/');
    w = f.contentWindow;
    P('cashier /sign/ 入到 signMain', !w.document.getElementById('signMain').classList.contains('hidden'));
    P('cashier canSignSlot(social)=false', w.eval('canSignSlot("social")') === false);
    P('cashier canSignSlot(officer)=true', w.eval('canSignSlot("officer")') === true);
    f.remove();
    f = await loadFrame('/report/');
    w = f.contentWindow;
    P('cashier /report/ 入到 reportMain', !w.document.getElementById('reportMain').classList.contains('hidden'));
    f.remove();

    // ---- manager ----
    setAuth('manager');
    f = await loadFrame('/sign/');
    w = f.contentWindow;
    P('manager canSignSlot(reviewer)=true', w.eval('canSignSlot("reviewer")') === true);
    P('manager canSignSlot(social)=false', w.eval('canSignSlot("social")') === false);
    f.remove();

    // ---- 無 role（舊 session 冇 role 欄）→ 當 tutor ----
    sessionStorage.setItem('cyc-portal-auth', JSON.stringify({ p: 'test', exp: Date.now() + 3600000, email: 'test@sbccyc.org.hk' }));
    f = await loadFrame('/sign/');
    w = f.contentWindow;
    P('冇 role /sign/ 顯示 noPerm（當導師）', !w.document.getElementById('noPerm').classList.contains('hidden'));
    f.remove();
  } catch (e) {
    log.push('ERROR ' + e.message);
  }
  document.getElementById('log').textContent = log.join('\n') + '\nDONE';
})();
</script>
</body>
</html>
