<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>auth test</title></head>
<body>
<pre id="log">running…</pre>
<script>
const log = [];
const P = (name, ok) => log.push((ok ? 'PASS' : 'FAIL') + ' ' + name);
const KEY = 'cyc-portal-auth', D30 = 30 * 24 * 60 * 60 * 1000;
function loadFrame(url){
  return new Promise(res => {
    const f = document.createElement('iframe');
    f.style.cssText = 'width:800px;height:600px';
    f.src = url;
    f.onload = () => setTimeout(() => res(f), 1200);
    document.body.appendChild(f);
  });
}
(async () => {
  try {
    // 1. localStorage 有效 session → /sign/ 唔會被彈走，兼且自動續期
    localStorage.clear(); sessionStorage.clear();
    const nearExp = Date.now() + 60 * 1000;   // 1 分鐘後過期
    localStorage.setItem(KEY, JSON.stringify({ p: 'test', exp: nearExp, email: 'tan.kl@sbccyc.org.hk', role: 'sw' }));
    let f = await loadFrame('/sign/');
    let w = f.contentWindow;
    P('有效 session /sign/ 留得住（冇跳走）', w.location.pathname === '/sign/');
    const after = JSON.parse(localStorage.getItem(KEY));
    P('使用後自動續期約 30 日', after.exp > Date.now() + D30 - 60000 && after.exp <= Date.now() + D30 + 5000);
    P('續期保留 role', after.role === 'sw');
    f.remove();

    // 2. 過期 session → 被彈走＋清除
    localStorage.setItem(KEY, JSON.stringify({ p: 'test', exp: Date.now() - 1000, role: 'sw' }));
    f = await loadFrame('/sign/');
    w = f.contentWindow;
    P('過期 session 被彈返入口頁', w.location.pathname === '/' || w.location.pathname === '');
    f.remove();

    // 3. 舊 sessionStorage 遷移：子頁會搬落 localStorage
    localStorage.clear(); sessionStorage.clear();
    sessionStorage.setItem(KEY, JSON.stringify({ p: 'test', exp: Date.now() + 3600000, role: 'tutor' }));
    f = await loadFrame('/report/');
    w = f.contentWindow;
    const mig = JSON.parse(localStorage.getItem(KEY) || 'null');
    P('舊 sessionStorage 自動遷移去 localStorage', !!(mig && mig.p === 'test'));
    P('遷移後 sessionStorage 已清', sessionStorage.getItem(KEY) === null);
    P('遷移後自動續期約 30 日', mig && mig.exp > Date.now() + D30 - 60000);
    f.remove();

    // 4. 冇 session → 被彈走
    localStorage.clear(); sessionStorage.clear();
    f = await loadFrame('/vault/');
    w = f.contentWindow;
    P('冇 session /vault/ 被彈返入口頁', w.location.pathname === '/' || w.location.pathname === '');
    f.remove();
  } catch (e) {
    log.push('ERROR ' + e.message);
  }
  document.getElementById('log').textContent = log.join('\n') + '\nDONE';
})();
</script>
</body>
</html>
