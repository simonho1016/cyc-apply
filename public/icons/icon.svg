<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.6" fill="rgba(20,20,20,0.14)"/>
    </pattern>
  </defs>
  <!-- 黃底＋圓點（同網站背景一致） -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#ffd23f"/>
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#dots)"/>
  <rect x="10" y="10" width="492" height="492" rx="96" fill="none" stroke="#141414" stroke-width="16"/>

  <!-- 夾萬：黑色硬陰影 -->
  <rect x="118" y="132" width="280" height="240" rx="28" fill="#141414"/>
  <!-- 夾萬身（白） -->
  <rect x="102" y="116" width="280" height="240" rx="28" fill="#ffffff" stroke="#141414" stroke-width="14"/>
  <!-- 門框內線 -->
  <rect x="128" y="142" width="228" height="188" rx="18" fill="none" stroke="#141414" stroke-width="8"/>

  <!-- 密碼轉盤 -->
  <circle cx="206" cy="236" r="52" fill="#ffd23f" stroke="#141414" stroke-width="10"/>
  <circle cx="206" cy="236" r="14" fill="#141414"/>
  <g stroke="#141414" stroke-width="8" stroke-linecap="round">
    <line x1="206" y1="196" x2="206" y2="210"/>
    <line x1="206" y1="262" x2="206" y2="276"/>
    <line x1="166" y1="236" x2="180" y2="236"/>
    <line x1="232" y1="236" x2="246" y2="236"/>
  </g>

  <!-- 門柄 -->
  <rect x="286" y="218" width="52" height="36" rx="18" fill="#141414"/>
  <circle cx="312" cy="236" r="9" fill="#ffffff"/>

  <!-- 金幣（右下角，压住夾萬） -->
  <circle cx="352" cy="372" r="72" fill="#141414"/>
  <circle cx="340" cy="360" r="72" fill="#ffd23f" stroke="#141414" stroke-width="12"/>
  <text x="340" y="392" font-family="Arial Black, Arial, sans-serif" font-size="92" font-weight="900" fill="#141414" text-anchor="middle">$</text>
</svg>
