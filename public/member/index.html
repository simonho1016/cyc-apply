<style>
  :root { --ink:#141414; --pow:#fdf6ec; }
  body { font-family: "Huninn", "Noto Sans TC", sans-serif; background-color: var(--pow);
    background-image: radial-gradient(rgba(20,20,20,.14) 1.6px, transparent 1.7px); background-size: 15px 15px; }
  .card { border: 3px solid var(--ink) !important; box-shadow: 5px 5px 0 var(--ink) !important; border-radius: 16px !important; }
  #toast { background: var(--ink) !important; border: 3px solid #fff !important; box-shadow: 4px 4px 0 rgba(20,20,20,.35) !important;
    font-family: "Huninn", sans-serif !important; font-size: 15px; }
  /* 舍友展示模式：收埋操作區，放大字體，方便拎俾舍友睇 */

  body.present #cardSum .sum-big { font-size: 2.6rem; }
  body.present #historyBox { font-size: 1.05rem; }

  /* ── 列印：舍友零用金收支紀錄表（同月結版式一樣，A4 直向） ── */
  .ms-sheet { max-width: 820px; margin: 0 auto 24px; padding: 32px 28px; background: #fff; color: #000;
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif; }
  .ms-sheet h1 { text-align: center; font-size: 20px; font-weight: 700; margin: 0 0 2px; }
  .ms-sheet h2 { text-align: center; font-size: 17px; font-weight: 700; margin: 0 0 10px; }
  .ms-sheet table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  .ms-sheet th, .ms-sheet td { border: 1.5px solid #000; padding: 2px 7px; font-size: 13px; }
  .ms-sheet th { background: #fff; text-align: left; }
  .ms-num { text-align: right; font-variant-numeric: tabular-nums; }
  .mr-sheet { page-break-after: always; width: 186mm; max-width: 186mm; }
  .mr-head { display: flex; justify-content: space-between; font-size: 14.5px; font-weight: 700; margin-bottom: 4px; }
  .mr-sheet table.tx { table-layout: fixed; }
  .mr-sheet table.tx th, .mr-sheet table.tx td { padding: 2px 6px; font-size: 12.5px; height: 26px; vertical-align: middle; }
  .mr-sheet table.tx td.desc { font-size: 11.5px; line-height: 1.35; }
  .mr-sum { display: flex; justify-content: space-between; gap: 24px; margin-top: 14px; align-items: flex-start; }
  .mr-sum table { width: 52%; }
  .mr-sum th, .mr-sum td { text-align: center; font-size: 12.5px; }
  .mr-sig { font-size: 14.5px; width: 47%; }
  .mr-sig .row { display: flex; align-items: flex-end; justify-content: flex-end; gap: 4px; margin-bottom: 8px; }
  .mr-sig .row.gap { margin-top: 18px; }
  .mr-sig .row.full { justify-content: flex-start; }
  .mr-sig .lbl { min-width: 5.2em; text-align: right; white-space: nowrap; }
  .mr-sig .row.full .lbl { min-width: 0; text-align: left; }
  .mr-sig small { font-size: 10px; white-space: nowrap; }
  .mr-sig .line { display: inline-block; width: 140px; height: 1.25em; border-bottom: 1.5px solid #000; position: relative; vertical-align: bottom; flex-shrink: 0; }
  .mr-sig .row.full .line { flex: 1; }
  .mr-sig .brack { position: absolute; right: 0; bottom: 0; line-height: 1; font-size: 13px; }
  @media print {
    @page { size: A4; margin: 12mm 12mm; }
    body { background: #fff !important; background-image: none !important; }
    body.print-statement > *:not(#sheetLayer) { display: none !important; }
    body.print-statement #sheetLayer { position: static !important; overflow: visible !important; border: none !important; box-shadow: none !important; border-radius: 0 !important; }
    body.print-statement #sheetLayer .no-print { display: none !important; }
    .ms-sheet { max-width: none; padding: 0; margin: 0; box-shadow: none !important; border: none !important; }
    .mr-sheet:last-child { page-break-after: auto; }
  }
</style>

<script>
// ====================== 入口頁統一登入 ======================
(function(){
  try {
    var mig = sessionStorage.getItem('cyc-portal-auth');
    if (mig && !localStorage.getItem('cyc-portal-auth')) localStorage.setItem('cyc-portal-auth', mig);
    if (mig) sessionStorage.removeItem('cyc-portal-auth');
    var h = new URLSearchParams(location.hash.slice(1)), k = h.get('key'), t = Number(h.get('t'));
    if (k && isFinite(t) && Math.abs(Date.now() - t) < 86400000) {
      localStorage.setItem('cyc-portal-auth', JSON.stringify({ p: k, exp: Date.now() + 30 * 24 * 60 * 60 * 1000 }));
    }
    if (k || h.get('t')) history.replaceState(null, '', location.pathname + location.search);
  } catch (e) {}
  function ok(){
    try {
      var a = JSON.parse(localStorage.getItem('cyc-portal-auth') || 'null');
      if (!(a && typeof a.p === 'string' && a.p && Number.isFinite(a.exp) && Date.now() < a.exp)) return false;
      a.exp = Date.now() + 30 * 24 * 60 * 60 * 1000;
      localStorage.setItem('cyc-portal-auth', JSON.stringify(a));
      return true;
    } catch (e) { return false; }
  }
  if (!ok()) { location.replace('/'); return; }
  setInterval(function(){ if (!ok()) location.replace('/'); }, 15000);
})();
</script>

<script>
(function(){
  var btn = document.getElementById('navBtn'), menu = document.getElementById('navMenu');
  if (!btn || !menu) return;
  var cur = location.pathname;
  menu.querySelectorAll('[data-nav]').forEach(function(b){ if (b.getAttribute('data-nav') === cur) b.classList.add('hidden'); });
  btn.addEventListener('click', function(e){ e.stopPropagation(); menu.classList.toggle('hidden'); });
  document.addEventListener('click', function(e){ if (!menu.classList.contains('hidden') && !menu.contains(e.target) && e.target !== btn) menu.classList.add('hidden'); });
})();
</script>

<script>
// ====================== 基本 ======================
const $ = id => document.getElementById(id);
const SUPABASE_URL = 'https://abtsyfbbtpvozywqaofs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_beq8adbuLrISIgnpbAaLEw_Da1Fva-r';

// ---- 角色（同其他頁一致：模擬檢視只對真 admin 生效）----
const VALID_ROLES = ['admin', 'manager', 'cashier', 'sw', 'tutor'];
const ROLE_LABELS = { admin: 'admin', manager: '管理級', cashier: '管理夾萬同工', sw: '社工', tutor: '導師' };
function realRole(){
  try {
    const a = JSON.parse(localStorage.getItem('cyc-portal-auth') || 'null');
    return (a && VALID_ROLES.includes(a.role)) ? a.role : 'tutor';
  } catch { return 'tutor'; }
}
function simInfo(){
  if (realRole() !== 'admin') return null;
  try {
    const s = JSON.parse(sessionStorage.getItem('cyc-sim') || 'null');
    return (s && VALID_ROLES.includes(s.role)) ? s : null;
  } catch { return null; }
}
function sessionRole(){ const s = simInfo(); return s ? s.role : realRole(); }
function sessionEmail(){
  const s = simInfo();
  if (s && s.email) return s.email;
  try {
    const a = JSON.parse(localStorage.getItem('cyc-portal-auth') || 'null');
    return (a && a.email) || '';
  } catch { return ''; }
}
const ROLE_NOW = sessionRole();
if (ROLE_NOW !== 'admin' && ROLE_NOW !== 'manager') $('t_admin').classList.add('hidden');
if (ROLE_NOW === 'tutor') $('t_sign').classList.add('hidden');
const SIM_NOW = simInfo();
if (SIM_NOW) {
  const simWho = SIM_NOW.name || SIM_NOW.email || '';
  $('simBanner').classList.remove('hidden');
  $('simBanner').innerHTML = '🔭 模擬檢視中：以「' + ROLE_LABELS[SIM_NOW.role] + '」' + (simWho ? '（' + simWho + '）' : '') + ' 視角瀏覽 · <button id="simStopBtn" class="underline font-bold">取消模擬</button>';
  $('simStopBtn').addEventListener('click', () => { sessionStorage.removeItem('cyc-sim'); location.reload(); });
}
$('adminLogout').classList.remove('hidden');
$('adminLogout').addEventListener('click', () => location.href = '/');

// ---- Supabase ----
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
async function getSettingValue(key){
  const { data, error } = await sb.from('settings').select('value').eq('key', key).maybeSingle();
  if (error) throw new Error(error.message);
  return data ? data.value : null;
}

// ---- 工具 ----
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2600);
}
function escapeHtml(s){ return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','&gt;':'&gt;','"':'&quot;'}[c])); }
const money = n => '$' + Number(n || 0).toFixed(2);
const r2 = n => Math.round(n * 100) / 100;
function fmtD(iso, withTime){
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  const base = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  return withTime ? base + ` ${p(d.getHours())}:${p(d.getMinutes())}` : base;
}

// ====================== 資料載入 ======================
let MEMBERS = {};        // {社名:[{id,name,exited?}]}
let MY_KEYS = null;      // 權限社別；null＝無限制
let ALL_MEMBERS = [];    // 扁平化名單（已按權限過濾）
let SEL = null;          // 揀咗嘅舍友 {id,name,house,exited}
let BAL_MAP = {};

const myHouses = () => MY_KEYS ? window.HOUSES.filter(h => MY_KEYS.includes(h.key)) : window.HOUSES;

async function boot(){
  try {
    const [dir, membersDb, bal] = await Promise.all([
      getSettingValue('staff_dir'), getSettingValue('members'), getSettingValue('member_bal')
    ]);
    const em = (sessionEmail() || '').toLowerCase();
    const c = em && dir && typeof dir === 'object' ? dir[em] : null;
    MY_KEYS = window.accessibleHouseKeys(ROLE_NOW, c);
    if (!membersDb || typeof membersDb !== 'object') {
      $('memberList').innerHTML = '<p class="text-sm text-red-500 col-span-full py-2">未能讀取舍友名單，請聯絡 admin。</p>';
      return;
    }
    MEMBERS = membersDb;
    BAL_MAP = (bal && typeof bal === 'object') ? bal : {};
    ALL_MEMBERS = [];
    myHouses().forEach(h => (Array.isArray(MEMBERS[h.name]) ? MEMBERS[h.name] : []).forEach(m => {
      ALL_MEMBERS.push({ id: m.id || '', name: m.name, house: h.name, color: h.color, soft: h.soft, exited: !!m.exited });
    }));
    renderChips();
    renderList();
    $('mainScreen').classList.remove('hidden');
    // URL 參數：?id=A16（同事喺其他頁過嚟直達）
    try {
      const qid = new URLSearchParams(location.search).get('id');
      if (qid) {
        const hit = ALL_MEMBERS.find(m => m.id === qid);
        if (hit) selectMember(hit);
      }
    } catch {}
  } catch (e) {
    $('memberList').innerHTML = `<p class="text-sm text-red-500 col-span-full py-2">載入失敗：${escapeHtml(e.message)}</p>`;
    $('mainScreen').classList.remove('hidden');
  }
}

// ---- 社別篩選 chips ----
let CHIP_HOUSE = '';   // 空＝全部可見社別
function renderChips(){
  const btn = (label, val, color) => {
    const on = CHIP_HOUSE === val;
    return `<button data-chip="${val}" class="chip-btn px-2.5 py-1 rounded-full text-xs font-bold transition ${on ? 'text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}"${on ? ` style="background:${color || '#334155'}"` : ''}>${label}</button>`;
  };
  $('houseChips').innerHTML = btn('全部', '') + myHouses().map(h => btn(h.name, h.name, h.color)).join('');
}
$('houseChips').addEventListener('click', e => {
  const b = e.target.closest('.chip-btn');
  if (!b) return;
  CHIP_HOUSE = b.dataset.chip;
  renderChips();
  renderList();
});

// ---- 舍友清單（搜尋社別／編號／姓名）----
function renderList(){
  const q = ($('q').value || '').trim().toLowerCase();
  const list = ALL_MEMBERS.filter(m => {
    if (CHIP_HOUSE && m.house !== CHIP_HOUSE) return false;
    if (!q) return true;
    return (m.name + ' ' + m.id + ' ' + m.house).toLowerCase().includes(q);
  });
  $('memberList').innerHTML = list.length ? list.map(m => `
    <button class="mem-btn text-left px-2 py-1.5 rounded-lg transition hover:bg-sky-50 ${m.exited ? 'opacity-50' : ''}" data-key="${escapeHtml(m.id || m.name)}">
      <span class="inline-block w-1.5 h-1.5 rounded-full mr-1" style="background:${m.color}"></span><b>${escapeHtml(m.name)}</b>
      <span class="text-xs text-slate-400">${escapeHtml(m.id)} · ${m.house.replace(/社$/, '')}${m.exited ? ' · 已退出' : ''}</span>
    </button>`).join('') : '<p class="text-xs text-slate-400 col-span-full py-2">冇符合嘅舍友。</p>';
}
$('q').addEventListener('input', renderList);
$('memberList').addEventListener('click', e => {
  const b = e.target.closest('.mem-btn');
  if (!b) return;
  const m = ALL_MEMBERS.find(x => (x.id || x.name) === b.dataset.key);
  if (m) selectMember(m);
});

// ====================== 揀咗舍友：摘要＋紀錄 ======================
function selectMember(m){
  SEL = m;
  document.querySelectorAll('.mem-btn').forEach(b => {
    const on = b.dataset.key === (m.id || m.name);
    b.classList.toggle('ring-2', on);
    b.classList.toggle('ring-sky-400', on);
    b.classList.toggle('bg-sky-50', on);
  });
  $('sum_house').textContent = m.house;
  $('sum_house').style.background = m.color;
  $('sum_name').textContent = m.name;
  $('sum_id').textContent = m.id || '';
  $('sum_exited').classList.toggle('hidden', !m.exited);
  const bal = Number(BAL_MAP[m.id || m.name]) || 0;
  $('sum_bal').textContent = money(bal);
  $('sum_bal').style.color = m.color;
  $('cardSum').classList.remove('hidden');
  $('cardHis').classList.remove('hidden');
  loadHistory();
}

// ---- 時段 ----
function rangeVals(){
  return { from: $('d_from').value, to: $('d_to').value };
}
function setRange(from, to){
  $('d_from').value = from || '';
  $('d_to').value = to || '';
  document.querySelectorAll('.range-btn').forEach(b => {
    const on = (b.dataset.range === 'all' && !from && !to);
    b.className = 'range-btn px-3 py-1.5 rounded-lg text-xs font-bold transition ' + (on ? 'bg-slate-700 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200');
  });
}
document.querySelectorAll('.range-btn').forEach(b => b.addEventListener('click', () => {
  const now = new Date(), p = n => String(n).padStart(2, '0');
  if (b.dataset.range === 'all') setRange('', '');
  else if (b.dataset.range === 'cur') setRange(`${now.getFullYear()}-${p(now.getMonth()+1)}-01`, now.toLocaleDateString('sv'));
  else {
    const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const last = new Date(now.getFullYear(), now.getMonth(), 0);
    setRange(prev.toLocaleDateString('sv'), last.toLocaleDateString('sv'));
  }
  if (SEL) loadHistory();
}));
['d_from', 'd_to'].forEach(id => $(id).addEventListener('change', () => {
  document.querySelectorAll('.range-btn').forEach(b => b.className = 'range-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition');
  if (SEL) loadHistory();
}));

// ---- 紀錄類型 ----
const KIND = {
  opening:      ['開戶起點', 'bg-slate-200 text-slate-700'],
  deposit:      ['存入',     'bg-emerald-100 text-emerald-700'],
  expense:      ['支出',     'bg-red-100 text-red-600'],
  settle:       ['結算',     'bg-teal-100 text-teal-700'],
  transfer:     ['過錢',     'bg-amber-100 text-amber-700'],
  adjust:       ['人手修正', 'bg-slate-100 text-slate-500'],
  rollback:     ['刪單回補', 'bg-orange-100 text-orange-600'],
  transfer_in:  ['轉社過入', 'bg-indigo-100 text-indigo-700'],
  transfer_out: ['轉社過出', 'bg-indigo-100 text-indigo-700']
};
const ACCT = { big: '現存現金', small: '代管現金' };

async function loadHistory(){
  if (!SEL) return;
  const box = $('historyBox');
  box.innerHTML = '<p class="text-xs text-slate-400 py-2">載入中…</p>';
  $('his_count').textContent = '';
  try {
    const key = SEL.id || SEL.name;
    // 用編號或姓名都搵到（轉社後編號會改，所以兩邊都包）
    const keys = [...new Set([SEL.id, SEL.name].filter(Boolean))];
    const orQ = [...new Set([`member_id.in.("${keys.join('","')}")`, `member_name.in.("${keys.join('","')}")`])].join(',');
    let q = sb.from('ledger').select('*').or(orQ).order('created_at', { ascending: true }).limit(2000);
    const { from, to } = rangeVals();
    if (from) q = q.gte('created_at', from + 'T00:00:00');
    if (to) q = q.lte('created_at', to + 'T23:59:59');
    const { data, error } = await q;
    if (error) throw new Error(error.message);
    const rows = (data || []).filter(r => keys.includes(r.member_id || '') || keys.includes(r.member_name || ''));
    LAST_ROWS = rows;   // 列印用
    renderHistory(rows);
    renderStats(rows);
  } catch (e) {
    box.innerHTML = `<p class="text-sm text-red-500 py-2">讀取失敗：${escapeHtml(e.message)}</p>`;
  }
}

function renderStats(rows){
  // 時段內：收入（正 member_delta）／支出（負 member_delta）／代管結算／筆數
  let inc = 0, exp = 0, settle = 0;
  rows.forEach(r => {
    const md = Number(r.member_delta || 0);
    if (md > 0) inc = r2(inc + md);
    if (md < 0) exp = r2(exp + Math.abs(md));
    if (r.kind === 'settle') settle = r2(settle + Math.abs(Number(r.account_delta || 0)));
  });
  const card = (label, val, cls) => `<div class="rounded-xl border-2 border-slate-200 p-3"><div class="text-xs text-slate-500">${label}</div><div class="text-lg font-black mt-0.5 ${cls}">${val}</div></div>`;
  $('sum_stats').innerHTML =
    card('時段收入', '<span class="text-emerald-600">' + money(inc) + '</span>', '') +
    card('時段支出', '<span class="text-red-500">' + money(exp) + '</span>', '') +
    card('夾萬結算扣減', money(settle), 'text-teal-600') +
    card('紀錄筆數', rows.length + ' 筆', 'text-slate-700');
}

function renderHistory(rows){
  $('his_range').textContent = (() => {
    const { from, to } = rangeVals();
    return from || to ? `（${from || '開戶'} 至 ${to || '今日'}）` : '（由開戶至今）';
  })();
  $('his_count').textContent = rows.length ? `共 ${rows.length} 筆` : '';
  if (!rows.length) {
    $('historyBox').innerHTML = '<p class="text-sm text-slate-400 text-center py-4">呢個時段冇戶口紀錄。</p>';
    return;
  }
  $('historyBox').innerHTML = rows.map(r => {
    const [label, cls] = KIND[r.kind] || [r.kind || '紀錄', 'bg-slate-100 text-slate-500'];
    const md = r.member_delta, ad = r.account_delta;
    let amtHtml = '';
    if (md !== null && md !== undefined && Number(md) !== 0) {
      const n = Number(md);
      amtHtml = `<span class="font-black ${n > 0 ? 'text-emerald-600' : 'text-red-500'}">${n > 0 ? '+' : ''}${money(n)}</span>`;
    } else if (ad !== null && ad !== undefined && Number(ad) !== 0) {
      const n = Number(ad);
      amtHtml = `<span class="font-bold ${n > 0 ? 'text-emerald-600' : 'text-red-500'}">${n > 0 ? '+' : ''}${money(n)}</span><span class="block text-[10px] text-slate-400">${ACCT[r.account] || '夾萬'}</span>`;
    } else amtHtml = '<span class="text-slate-300">—</span>';
    const balAfter = (r.member_bal_after !== null && r.member_bal_after !== undefined) ? `結存 ${money(r.member_bal_after)}` : '';
    const meta = [
      r.house ? window.houseNameOf(r.house) : '',
      r.receipt_no ? '收據 ' + r.receipt_no : '',
      r.serial ? '序號 ' + r.serial : '',
      r.staff ? '經手 ' + r.staff : '',
      r.staff2 ? '→ ' + r.staff2 : '',
      r.note || ''
    ].filter(Boolean).join(' · ');
    return `<div class="flex items-center gap-2 border-b border-slate-100 pb-1.5">
      <span class="shrink-0 w-20 text-xs text-slate-400">${fmtD(r.created_at)}</span>
      <span class="shrink-0 rounded-full px-2 py-0.5 text-xs font-bold ${cls}">${label}</span>
      <span class="flex-1 min-w-0 truncate text-xs text-slate-500">${escapeHtml(meta)}${balAfter ? ` <span class="text-slate-400">｜${balAfter}</span>` : ''}</span>
      <span class="shrink-0 text-right">${amtHtml}</span>
    </div>`;
  }).join('');
}

// ====================== 列印：舍友零用金收支紀錄表（同月結版式；時段＝而家揀嘅範圍） ======================
let LAST_ROWS = [];
const fmtMoney = n => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function fmtDHM(d){ const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
// 經手人＝該社管理夾萬同工（冇例外）；未指派就先留空
let OFFICERS_CACHE = {};   // houseKey → [姓名...]
async function officersOf(hk){
  if (OFFICERS_CACHE[hk]) return OFFICERS_CACHE[hk];
  const out = [];
  try {
    const [roles, dir] = await Promise.all([getSettingValue('roles'), getSettingValue('staff_dir')]);
    if (roles && typeof roles === 'object') {
      Object.keys(roles).forEach(em => {
        if (roles[em] !== 'cashier') return;
        const c = dir && typeof dir === 'object' ? dir[String(em).toLowerCase()] : null;
        if (!c || c.deleted || !c.name) return;
        const hs = Array.isArray(c.houses) && c.houses.length ? c.houses : (c.house ? [c.house] : []);
        if (hs.includes(hk)) out.push(c.name);
      });
    }
  } catch {}
  OFFICERS_CACHE[hk] = out;
  return out;
}

async function buildSheet(){
  const key = SEL.id || SEL.name;
  const keys = [...new Set([SEL.id, SEL.name].filter(Boolean))];
  const { from, to } = rangeVals();
  // 承前結餘：範圍開始前最後一筆嘅結存快照；冇揀開始日＝由開戶計（0 起）
  let opening = 0;
  if (from) {
    const orQ = [...new Set([`member_id.in.("${keys.join('","')}")`, `member_name.in.("${keys.join('","')}")`])].join(',');
    const { data: pre } = await sb.from('ledger').select('member_id,member_name,member_bal_after,created_at')
      .or(orQ).lt('created_at', from + 'T00:00:00').order('created_at', { ascending: false }).limit(20);
    const hit = (pre || []).find(r => (keys.includes(r.member_id || '') || keys.includes(r.member_name || '')) && r.member_bal_after !== null && r.member_bal_after !== undefined);
    if (hit) opening = Number(hit.member_bal_after) || 0;
  }
  // 支出單嘅類別／備註（用 serial 對返 applications）
  const serials = [...new Set(LAST_ROWS.filter(r => r.kind === 'expense' && r.serial).map(r => r.serial))];
  const appBySerial = {};
  if (serials.length) {
    const { data: apps } = await sb.from('applications').select('serial,cats,cat_other,remark').in('serial', serials).limit(1000);
    (apps || []).forEach(a => { if (a.serial) appBySerial[a.serial] = a; });
  }
  let bal = opening, totIn = 0, totOut = 0;
  const catSum = { '車費': 0, '零用金': 0, '活動費用': 0, '其他': 0 };
  const txns = [];
  LAST_ROWS.forEach(r => {
    const d = new Date(r.created_at);
    const delta = Number(r.member_delta || 0);
    const push = (desc, inn, out) => {
      bal = r2(bal + (inn || 0) - (out || 0));
      txns.push({ d, desc, in: inn, out, bal, payer: out ? SEL.name : '' });
    };
    if (r.kind === 'deposit') { totIn = r2(totIn + delta); push(escapeHtml(r.note || '存入') + (r.receipt_no ? `<br>${escapeHtml(r.receipt_no)}` : ''), delta, null); }
    else if (r.kind === 'opening') { totIn = r2(totIn + delta); push(escapeHtml(r.note || '開戶起點'), delta, null); }
    else if (r.kind === 'expense') {
      const amt = -delta || Number(r.amount || 0);
      totOut = r2(totOut + amt);
      const app = appBySerial[r.serial || ''];
      const cats = app && app.cats && app.cats.length ? app.cats : ['其他'];
      catSum[cats[0]] = r2((catSum[cats[0]] || 0) + amt);
      const bits = [escapeHtml(cats.join('、'))];
      if (app && app.cat_other) bits.push(escapeHtml(app.cat_other));
      if (app && app.remark) bits.push(escapeHtml(app.remark));
      if (r.serial) bits.push('#' + escapeHtml(r.serial));
      push(bits.join('　'), null, amt);
    }
    else if (r.kind === 'rollback') { const amt = delta || Number(r.amount || 0); totOut = r2(totOut - amt); push('刪單回補' + (r.serial ? '　#' + escapeHtml(r.serial) : ''), amt, null); }
    else if (r.kind === 'transfer_in') { totIn = r2(totIn + delta); push(escapeHtml(r.note || '轉社轉入'), delta, null); }
    else if (r.kind === 'transfer_out') { const amt = -delta || Number(r.amount || 0); totOut = r2(totOut + amt); push(escapeHtml(r.note || '轉社轉出'), null, amt); }
    else if (r.kind === 'adjust' && delta) { if (delta > 0) totIn = r2(totIn + delta); else totOut = r2(totOut - delta); push(escapeHtml(r.note || '人手修正'), delta > 0 ? delta : null, delta < 0 ? -delta : null); }
    // settle／transfer 係夾萬層面，唔列入舍友收支表
  });
  return { opening, txns, totIn, totOut, closing: r2(opening + totIn - totOut), catSum };
}

function sheetHtml(st, officerTxt){
  const ROWS = 21;
  const { from, to } = rangeVals();
  const rangeTxt = `${from || '開戶'} – ${to || '今日'}`;
  const SUM_CATS = ['車費', '零用金', '活動費用', '其他'];
  const txRows = st.txns.map(t => `
    <tr><td>${fmtDHM(t.d)}</td><td class="desc">${t.desc}</td>
      <td class="ms-num">${t.in !== null ? fmtMoney(t.in) : ''}</td>
      <td class="ms-num">${t.out !== null ? fmtMoney(t.out) : ''}</td>
      <td class="ms-num">${fmtMoney(t.bal)}</td>
      <td>${escapeHtml(officerTxt)}</td><td>${escapeHtml(t.payer)}</td></tr>`).join('');
  const blanks = Array.from({ length: Math.max(0, ROWS - 1 - st.txns.length) }, () => '<tr>' + '<td>&nbsp;</td>'.repeat(7) + '</tr>').join('');
  const sumRows = [['存入', fmtMoney(st.totIn), '']]
    .concat(SUM_CATS.map(c => [c, '', fmtMoney(st.catSum[c] || 0)]))
    .map((row, i) => `<tr><td>${i + 1}</td><td>${row[0]}</td><td class="ms-num">${row[1]}</td><td class="ms-num">${row[2]}</td>${i === 0 ? `<td rowspan="${SUM_CATS.length + 1}" class="ms-num" style="vertical-align:bottom;"><b>$${fmtMoney(st.closing)}</b></td>` : ''}</tr>`).join('');
  const sigRow = lbl => `<div class="row${lbl === '社工：' ? ' gap' : ''}"><span class="lbl">${lbl}</span><small>（姓名及簽署）</small><span class="line"><span class="brack">（　　）</span></span></div>`;
  return `<div class="ms-sheet mr-sheet">
    <h1>香港扶幼會 香港扶幼會則仁中心</h1>
    <h2>舍友零用金收支紀錄表</h2>
    <div class="mr-head"><span>姓名：${escapeHtml(SEL.id)} ${escapeHtml(SEL.name)}（${SEL.house}）</span><span>時段：${rangeTxt}</span></div>
    <table class="tx"><thead><tr>
      <th style="width:17%;">日期 時間</th><th>類別 / 備註</th>
      <th style="width:9%;" class="ms-num">存入</th><th style="width:9%;" class="ms-num">支出</th>
      <th style="width:11%;" class="ms-num">結餘</th><th style="width:10%;">經手人</th><th style="width:10%;">支取人</th>
    </tr></thead><tbody>
      <tr><td>${from || '—'}</td><td class="desc">承前結餘</td><td></td><td></td><td class="ms-num">${fmtMoney(st.opening)}</td><td></td><td></td></tr>
      ${txRows}${blanks}
    </tbody></table>
    <div class="mr-sum">
      <table><thead><tr><th style="width:12%;"></th><th>項目</th><th>存入小計</th><th>支出小計</th><th>戶口結餘</th></tr></thead>
      <tbody>${sumRows}
        <tr><td colspan="2"><b>總計</b></td><td class="ms-num"><b>$${fmtMoney(st.totIn)}</b></td><td class="ms-num"><b>$${fmtMoney(st.totOut)}</b></td><td class="ms-num"><b>$${fmtMoney(st.closing)}</b></td></tr>
      </tbody></table>
      <div class="mr-sig">
        <div class="row full"><span class="lbl">舍友簽署：</span><span class="line"></span></div>
        ${sigRow('負責職員：')}
        ${sigRow('審核職員：')}
        ${sigRow('社工：')}
      </div>
    </div>
  </div>`;
}

$('print_btn').addEventListener('click', async () => {
  if (!SEL) { alert('請先揀舍友。'); return; }
  if (!LAST_ROWS.length) { alert('呢個時段冇紀錄，唔使列印。'); return; }
  try {
    toast('準備列印版…');
    const officerTxt = (await officersOf(window.houseKeyOf(SEL.house))).join('、');
    const st = await buildSheet();
    $('sheetBody').innerHTML = sheetHtml(st, officerTxt);
    $('sheetLayer').classList.remove('hidden');
    document.body.classList.add('print-statement');
  } catch (e) { alert('列印準備失敗：' + e.message); }
});
$('sheet_print').addEventListener('click', () => window.print());
$('sheet_close').addEventListener('click', () => {
  $('sheetLayer').classList.add('hidden');
  document.body.classList.remove('print-statement');
});

// ---- 舍友展示模式 ----
$('presentOn').addEventListener('click', () => {
  document.body.classList.add('present');
  $('presentOff').classList.remove('hidden');
});
$('presentOff').addEventListener('click', () => {
  document.body.classList.remove('present');
  $('presentOff').classList.add('hidden');
});

setRange('', '');
boot();
</script>
